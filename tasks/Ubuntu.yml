- name: Install requisites
  apt:
    install_recommends: false
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release

- name: Create apt keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add apt KIT repository key ubuntu
  get_url:
    url: https://repo.data.kit.edu/repo-data-kit-edu-key.gpg
    dest: /etc/apt/keyrings/repo-data-kit-edu-key.asc
    mode: "0644"

- name: Add apt KIT repository ubuntu
  apt_repository:
    repo: deb [signed-by=/etc/apt/keyrings/repo-data-kit-edu-key.asc] https://repo.data.kit.edu/ubuntu/{{ansible_distribution_version}} ./
    state: present
